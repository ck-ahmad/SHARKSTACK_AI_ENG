version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterpriseiq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterpriseiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: enterpriseiq_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
